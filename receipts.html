<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نوبت‌های من</title>
  <meta name="theme-color" content="#2A1B2E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hero" style="border-radius:0 0 24px 24px; padding:30px 18px;">
    <div class="container">
      <div class="eyebrow">تاریخچه</div>
      <h1 style="font-size:22px;">نوبت‌های من</h1>
    </div>
  </div>

  <div class="container" style="margin-top:22px;">
    <div id="receipts-list"><div class="empty-note">در حال بارگذاری...</div></div>
    <a href="index.html" class="btn btn-block btn-ghost" style="margin-top:16px; text-decoration:none; display:inline-block; text-align:center;">بازگشت به صفحه رزرو</a>
    <a href="#" id="logout-link" style="display:block; text-align:center; margin-top:14px; font-size:12.5px; color:var(--muted); text-decoration:underline;">خروج از حساب</a>
  </div>

  <script src="jalali.js"></script>
  <script>
    document.getElementById('logout-link').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('customerToken');
      localStorage.removeItem('customerPhone');
      window.location.href = 'index.html';
    });
    const API_BASE = 'https://script.google.com/macros/s/AKfycbzWLPgSboFo7wzKlgFN8az3nehWEVrwX_ud21BzAl1R8cJCQPAR26UAClhMplTAcECb/exec';
    const STATUS_FA = { paid: 'پرداخت‌شده ✅', confirmed: 'تایید شده (حضوری)', pending: 'در انتظار پرداخت', cancelled: 'لغوشده', failed: 'ناموفق' };
    const wrap = document.getElementById('receipts-list');

    function renderBooking(b) {
      const item = document.createElement('div');
      item.className = 'list-item';
      item.style.cssText = 'background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px;';
      item.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong>${b.serviceName}</strong>
          <span style="font-size:11px; padding:3px 8px; border-radius:20px; background:rgba(199,161,92,0.18); color:#8a6c2e;">${STATUS_FA[b.status] || b.status}</span>
        </div>
        <div style="font-size:13px; color:var(--muted); margin-top:6px;">
          ${b.displayDate || jalaliReadable(b.date)} — ساعت ${b.time}<br>
          ${Number(b.price).toLocaleString('fa-IR')} تومان${Number(b.discountPercent) > 0 && b.discountKind !== 'birthday-released' ? ' — 🎁 ' + b.discountPercent + '٪ تخفیف' + (Number(b.originalPrice) ? ' (مبلغ اصلی ' + Number(b.originalPrice).toLocaleString('fa-IR') + ')' : '') : ''}
        </div>
      `;
      wrap.appendChild(item);
    }

    async function loadFromServer() {
      const token = localStorage.getItem('customerToken');
      if (!token) return false;
      try {
        const url = new URL(API_BASE);
        url.searchParams.set('action', 'getMyBookings');
        url.searchParams.set('token', token);
        const res = await fetch(url.toString());
        const data = await res.json();
        if (!data.ok) return false;
        wrap.innerHTML = '';
        if (data.bookings.length === 0) {
          wrap.innerHTML = '<div class="empty-note">هنوز نوبتی ثبت نکردی</div>';
        } else {
          data.bookings.forEach(renderBooking);
        }
        return true;
      } catch (e) {
        return false;
      }
    }

    function loadFromLocalStorage() {
      let ids = [];
      try { ids = JSON.parse(localStorage.getItem('receipts_list') || '[]'); } catch (e) {}
      wrap.innerHTML = '';
      if (ids.length === 0) {
        wrap.innerHTML = '<div class="empty-note">هنوز رسیدی روی این گوشی ذخیره نشده</div>';
        return;
      }
      ids.forEach((id) => {
        let r;
        try { r = JSON.parse(localStorage.getItem('receipt_' + id)); } catch (e) { return; }
        if (r) renderBooking({ ...r, price: r.amount });
      });
    }

    (async () => {
      const gotFromServer = await loadFromServer();
      if (!gotFromServer) loadFromLocalStorage();
    })();
  </script>
</body>
</html>
